<!-- MODAL : Paramètres -->
<div id="settingsModal" class="modal-overlay">
  <div class="modal-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h4 style="font-family: var(--font-title); color: var(--primary);">PARAMÈTRES SYSTÈME</h4>
      <button id="closeSettingsBtn" class="cyber-btn"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Choix de la couleur avec les teintes HSL (Hue) -->
    <div class="settings-group">
      <label class="settings-label">Couleur Néon Dominante</label>
      <div class="color-picker-grid">
        <div class="color-dot" data-hue="185" style="background: #00f0ff;"></div> <!-- Cyan -->
        <div class="color-dot" data-hue="340" style="background: #ff0055;"></div> <!-- Rose -->
        <div class="color-dot" data-hue="270" style="background: #7000ff;"></div> <!-- Violet -->
        <div class="color-dot" data-hue="140" style="background: #00ff66;"></div> <!-- Vert -->
        <div class="color-dot" data-hue="45"  style="background: #ffb700;"></div> <!-- Orange -->
      </div>
    </div>

    <div class="settings-group">
      <label class="settings-label">Type de Fond d'Écran</label>
      <select id="bgTypeSelect" class="cyber-btn" style="width: 100%; background: #000;">
        <option value="particles">Particules Noétiques</option>
        <option value="color">Couleur Unie</option>
        <option value="image">Image Personnalisée (URL)</option>
      </select>
    </div>

    <div id="bgColorGroup" class="settings-group" style="display: none;">
      <label class="settings-label">Couleur de Fond</label>
      <input type="color" id="bgColorInput" value="#030509" style="width: 100%; height: 35px; border: none; cursor: pointer;">
    </div>

    <div id="bgUrlGroup" class="settings-group" style="display: none;">
      <label class="settings-label">Lien de l'image (URL)</label>
      <input type="text" id="bgUrlInput" placeholder="https://" class="cyber-btn" style="width: 100%;">
    </div>

    <div class="settings-group">
      <label class="settings-label">Géométrie des Cartes</label>
      <div style="display: flex; gap: 8px;">
        <button class="cyber-btn radius-btn" data-radius="0px" style="flex: 1; justify-content: center;">Brut</button>
        <button class="cyber-btn radius-btn" data-radius="4px" style="flex: 1; justify-content: center;">Cyber</button>
        <button class="cyber-btn radius-btn" data-radius="14px" style="flex: 1; justify-content: center;">Lisse</button>
      </div>
    </div>

    <div class="settings-group" style="display: flex; justify-content: space-between; align-items: center;">
      <span class="settings-label" style="margin: 0;">Lignes CRT (Scanlines)</span>
      <input type="checkbox" id="scanlinesToggle" checked style="accent-color: var(--primary);">
    </div>

    <div class="settings-group" style="display: flex; justify-content: space-between; align-items: center;">
      <span class="settings-label" style="margin: 0;">Effets Sonores UI</span>
      <input type="checkbox" id="sfxToggle" checked style="accent-color: var(--primary);">
    </div>

    <div style="margin-top: 20px; text-align: right;">
      <button id="resetSettingsBtn" class="cyber-btn" style="border-color: var(--secondary); color: var(--secondary);">Réinitialiser</button>
    </div>
  </div>
</div>
