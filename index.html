<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Dashboard v0.2.0</title>

  <!-- Icônes & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Style modulaire -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modals.css">
</head>
<body>

  <!-- Background Canvas -->
  <canvas id="bgCanvas"></canvas>

  <div class="app-container">

    <!-- En-tête HUD : Horloge & Widget Météo -->
    <header class="nexus-panel hud-header">
      <div id="clockWidget" class="clock-container">
        <div id="clockDisplay" class="glow-text">00:00:00</div>
        <div id="dateDisplay" class="date-text">---</div>
      </div>
      <div id="weatherWidget" class="weather-container"></div>
    </header>

    <!-- Moteur de Recherche Cyberpunk -->
    <section class="nexus-panel search-panel">
      <form id="searchForm" autocomplete="off" class="search-form">
        
        <div class="engine-selector-wrapper">
          <select id="engineSelector" class="cyber-btn select-btn">
            <option value="google">Google</option>
            <option value="duckduckgo">DuckDuckGo</option>
            <option value="youtube">YouTube</option>
            <option value="github">GitHub</option>
            <option value="wikipedia">Wikipedia</option>
            <option value="chatgpt">ChatGPT</option>
          </select>
        </div>

        <div class="input-container">
          <input type="text" id="searchInput" placeholder="Rechercher ou préfixe (g/, yt/, gh/, wiki/, ai/)..." autocomplete="off" class="cyber-input">
          <ul id="searchSuggestions" class="suggestions-dropdown"></ul>
        </div>

        <button type="submit" class="cyber-btn submit-btn" aria-label="Lancer la recherche">
          <i class="fa-solid fa-bolt"></i>
        </button>
      </form>
    </section>

    <!-- Section Favoris -->
    <section class="nexus-panel fav-panel">
      <div class="fav-header">
        <div class="category-filters" id="categoryFilters">
          <button class="cyber-btn cat-btn active" data-cat="all">Tous</button>
          <button class="cyber-btn cat-btn" data-cat="dev">Dev</button>
          <button class="cyber-btn cat-btn" data-cat="media">Médias</button>
          <button class="cyber-btn cat-btn" data-cat="loisirs">Loisirs</button>
        </div>

        <div class="fav-actions">
          <button id="toggleEditFavs" class="cyber-btn icon-only" aria-label="Mode Édition" title="Mode Édition"><i class="fa-solid fa-pen"></i></button>
          <button id="addFavBtn" class="cyber-btn icon-only" aria-label="Ajouter un favori" title="Ajouter un favori"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>

      <!-- Grille des Cartes -->
      <div id="favoritesGrid" class="favorites-grid"></div>
    </section>

  </div>

  <!-- Badge Version v0.2.0 -->
  <div class="version-tag">v0.2.0</div>

  <!-- Bouton Paramètres -->
  <button id="openSettingsBtn" class="cyber-btn floating-settings-btn" aria-label="Paramètres">
    <i class="fa-solid fa-gear"></i>
  </button>

  <!-- MODAL : Ajout Favori -->
  <div id="addFavModal" class="modal-overlay">
    <div class="modal-container nexus-panel">
      <div class="modal-header">
        <h4>NOUVEAU FAVORI</h4>
        <button id="closeAddFavBtn" class="cyber-btn icon-only" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="favForm" class="modal-body">
        <div class="settings-group">
          <label class="settings-label" for="favNameInput">Nom du site</label>
          <input type="text" id="favNameInput" class="cyber-btn text-left" required>
        </div>
        <div class="settings-group">
          <label class="settings-label" for="favUrlInput">URL du site</label>
          <input type="url" id="favUrlInput" class="cyber-btn text-left" placeholder="https://" required>
        </div>
        <div class="settings-group">
          <label class="settings-label" for="favCategoryInput">Catégorie</label>
          <select id="favCategoryInput" class="cyber-btn dark-select">
            <option value="dev">Dev</option>
            <option value="media">Médias</option>
            <option value="loisirs">Loisirs</option>
          </select>
        </div>
        <button type="submit" class="cyber-btn full-width flex-center">Enregistrer</button>
      </form>
    </div>
  </div>

  <!-- MODAL : Paramètres -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-container nexus-panel">
      <div class="modal-header">
        <h4>PARAMÈTRES SYSTÈME</h4>
        <button id="closeSettingsBtn" class="cyber-btn icon-only" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-body">
        <div class="settings-group">
          <label class="settings-label">Couleur Néon</label>
          <div class="color-picker-grid">
            <button type="button" class="color-dot" data-hue="185" style="background: #00f0ff;" aria-label="Cyan"></button>
            <button type="button" class="color-dot" data-hue="340" style="background: #ff0055;" aria-label="Rose"></button>
            <button type="button" class="color-dot" data-hue="270" style="background: #7000ff;" aria-label="Violet"></button>
            <button type="button" class="color-dot" data-hue="140" style="background: #00ff66;" aria-label="Vert"></button>
            <button type="button" class="color-dot" data-hue="45"  style="background: #ffb700;" aria-label="Orange"></button>
          </div>
        </div>

        <div class="settings-group">
          <label class="settings-label" for="bgTypeSelect">Style de Fond</label>
          <select id="bgTypeSelect" class="cyber-btn dark-select full-width">
            <option value="particles">Particules Interactives</option>
            <option value="color">Couleur Unie</option>
            <option value="image">Image Personnalisée</option>
          </select>
        </div>

        <div id="bgColorGroup" class="settings-group" style="display: none;">
          <label class="settings-label" for="bgColorInput">Couleur de Fond</label>
          <input type="color" id="bgColorInput" value="#030509" class="color-picker-input">
        </div>

        <div id="bgUrlGroup" class="settings-group" style="display: none;">
          <label class="settings-label" for="bgUrlInput">Lien d'image (URL)</label>
          <input type="text" id="bgUrlInput" placeholder="https://" class="cyber-btn text-left full-width">
        </div>

        <div class="settings-group">
          <label class="settings-label">Arrondi des Cartes</label>
          <div class="radius-selector">
            <button type="button" class="cyber-btn radius-btn flex-center" data-radius="0px">Brut</button>
            <button type="button" class="cyber-btn radius-btn flex-center" data-radius="4px">Cyber</button>
            <button type="button" class="cyber-btn radius-btn flex-center" data-radius="14px">Lisse</button>
          </div>
        </div>

        <div class="settings-group flex-between">
          <label class="settings-label margin-0" for="scanlinesToggle">Filtre CRT Scanlines</label>
          <input type="checkbox" id="scanlinesToggle" checked class="cyber-checkbox">
        </div>

        <div class="modal-footer">
          <button id="resetSettingsBtn" class="cyber-btn danger-btn">Réinitialiser</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
