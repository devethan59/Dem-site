<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS // Interface Noétique</title>
  
  <!-- Font Awesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts : Orbitron & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Canvas pour arrière-plan interactif de particules -->
  <canvas id="bgCanvas"></canvas>
  <div class="bg-overlay"></div>

  <!-- Conteneur Principal -->
  <main class="app-container">
    
    <!-- Widget Horloge & Slogan -->
    <header class="header-widget">
      <div id="clock" class="digital-clock">00:00:00</div>
      <div id="date" class="digital-date">Lundi 1 Janvier</div>
      <div id="quote" class="noetic-quote">"L'esprit est le réseau ultime."</div>
    </header>

    <!-- Titre Cyberpunk -->
    <section class="brand-section">
      <h1 class="glitch-title" data-text="NEXUS">NEXUS</h1>
    </section>

    <!-- Barre de Recherche Hybride -->
    <section class="search-section">
      <form id="searchForm" class="search-box">
        
        <!-- Selecteur de moteur de recherche -->
        <div class="engine-selector">
          <button type="button" id="engineBtn" class="engine-btn" title="Changer de moteur">
            <i class="fa-brands fa-google" id="engineIcon"></i>
          </button>
          <div class="engine-dropdown" id="engineDropdown">
            <div class="engine-option active" data-engine="google" data-action="https://www.google.com/search" data-icon="fa-brands fa-google">Google</div>
            <div class="engine-option" data-engine="duckduckgo" data-action="https://duckduckgo.com/" data-icon="fa-solid fa-duck">DuckDuckGo</div>
            <div class="engine-option" data-engine="youtube" data-action="https://www.youtube.com/results" data-param="search_query" data-icon="fa-brands fa-youtube">YouTube</div>
            <div class="engine-option" data-engine="wikipedia" data-action="https://fr.wikipedia.org/wiki/Special:Search" data-icon="fa-brands fa-wikipedia-w">Wikipedia</div>
            <div class="engine-option" data-engine="github" data-action="https://github.com/search" data-icon="fa-brands fa-github">GitHub</div>
          </div>
        </div>

        <input type="text" id="searchInput" name="q" placeholder="Explorez le réseau..." autofocus autocomplete="off">
        
        <button type="submit" class="search-submit">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>
    </section>

    <!-- Grille des Favoris -->
    <section class="favorites-section">
      <div class="fav-header">
        <h2>Raccourcis Matrice</h2>
        <div class="fav-controls">
          <button id="toggleEditFavs" class="icon-btn" title="Gérer les favoris"><i class="fa-solid fa-pen-to-square"></i></button>
          <button id="openAddFavModal" class="icon-btn" title="Ajouter un favori"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>
      
      <div class="favorites-grid" id="favoritesGrid">
        <!-- Les favoris seront injectés par le script JS -->
      </div>
    </section>

  </main>

  <!-- Bouton Paramètres Fixe -->
  <button id="openSettingsBtn" class="floating-btn" title="Paramètres d'interface">
    <i class="fa-solid fa-sliders"></i>
  </button>

  <!-- MODALE : PARAMÈTRES D'INTERFACE -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fa-solid fa-gear"></i> Paramètres Nexus</h3>
        <button class="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        
        <div class="setting-group">
          <label>Mode de Fond d'Écran</label>
          <select id="bgTypeSelect">
            <option value="particles">Particules Noétiques (Dynamiques)</option>
            <option value="gradient">Dégradé Neon Synthwave</option>
            <option value="color">Couleur Unie Cyber</option>
            <option value="image">Image Personnalisée (URL)</option>
          </select>
        </div>

        <div class="setting-group" id="bgValueGroup" style="display: none;">
          <label id="bgValueLabel">Valeur du fond</label>
          <input type="text" id="bgValueInput" placeholder="Entrez la valeur...">
        </div>

        <div class="setting-group">
          <label>Style de Néon Dominant</label>
          <select id="neonColorSelect">
            <option value="cyan">Cyan Éthéré (#00f0ff)</option>
            <option value="magenta">Magenta Cyber (#ff0055)</option>
            <option value="purple">Violet Noétique (#8a2be2)</option>
            <option value="green">Vert Matrice (#00ff66)</option>
          </select>
        </div>

      </div>
      <div class="modal-footer">
        <button id="saveSettingsBtn" class="action-btn">Sauvegarder</button>
      </div>
    </div>
  </div>

  <!-- MODALE : AJOUTER UN FAVORI -->
  <div class="modal" id="addFavModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fa-solid fa-bookmark"></i> Nouveau Raccourci</h3>
        <button class="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label>Nom du site</label>
          <input type="text" id="favNameInput" placeholder="ex: GitHub">
        </div>
        <div class="setting-group">
          <label>Adresse URL</label>
          <input type="url" id="favUrlInput" placeholder="https://github.com">
        </div>
      </div>
      <div class="modal-footer">
        <button id="saveFavBtn" class="action-btn">Ajouter</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
