<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Dashboard</title>

  <!-- Icônes & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Style modulaire -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modals.css">
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="app-container">

    <!-- En-tête Horloge & Météo -->
    <header class="nexus-panel">
      <div id="clockWidget" class="clock-container">
        <div id="clockDisplay" class="clock-display">00:00:00</div>
        <div id="dateDisplay" class="date-display">---</div>
      </div>
      
      <!-- Widget Météo avec choix de ville -->
      <div id="weatherWidget" class="weather-container">
        <div class="weather-city-wrapper">
          <span id="weatherCityName">Elne</span>
          <button id="editCityBtn" class="icon-btn-inline" aria-label="Changer de ville"><i class="fa-solid fa-pen"></i></button>
        </div>
        <div id="weatherInfo">--°C</div>
      </div>
    </header>

    <!-- Moteur de Recherche -->
    <section class="nexus-panel">
      <form id="searchForm" autocomplete="off" class="search-form">
        <select id="engineSelector" class="cyber-btn" aria-label="Moteur de recherche">
          <option value="google">Google</option>
          <option value="duckduckgo">DuckDuckGo</option>
          <option value="youtube">YouTube</option>
          <option value="github">GitHub</option>
          <option value="wikipedia">Wikipedia</option>
          <option value="chatgpt">ChatGPT</option>
        </select>

        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="Rechercher ou préfixe (g/, yt/, gh/)..." autocomplete="off" aria-label="Champ de recherche">
          <ul id="searchSuggestions" class="suggestions-list hidden"></ul>
        </div>

        <button type="submit" class="cyber-btn cyber-btn-icon" aria-label="Rechercher">
          <i class="fa-solid fa-bolt"></i>
        </button>
      </form>
    </section>

    <!-- Favoris -->
    <section class="nexus-panel">
      <div class="favorites-header">
        <div id="categoryFilters" class="category-filters">
          <button class="cyber-btn cat-btn active" data-cat="all">Tous</button>
          <button class="cyber-btn cat-btn" data-cat="dev">Dev</button>
          <button class="cyber-btn cat-btn" data-cat="media">Médias</button>
          <button class="cyber-btn cat-btn" data-cat="loisirs">Loisirs</button>
        </div>

        <div class="action-buttons">
          <button id="toggleEditFavs" class="cyber-btn cyber-btn-icon" aria-label="Mode Édition"><i class="fa-solid fa-pen"></i></button>
          <button id="addFavBtn" class="cyber-btn cyber-btn-icon" aria-label="Ajouter un favori"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>

      <div id="favoritesGrid" class="favorites-grid"></div>
    </section>

    <!-- Section ToDo List -->
    <section class="nexus-panel">
      <div class="todo-header">
        <h3 class="panel-title"><i class="fa-solid fa-list-check"></i> TÂCHES</h3>
      </div>
      <form id="todoForm" class="todo-form">
        <input type="text" id="todoInput" placeholder="Nouvelle tâche..." class="cyber-input">
        <button type="submit" class="cyber-btn cyber-btn-icon"><i class="fa-solid fa-plus"></i></button>
      </form>
      <ul id="todoList" class="todo-list"></ul>
    </section>

  </div>

  <!-- Badge Version -->
  <div class="version-tag">
    v0.2.0
  </div>

  <!-- Bouton Paramètres -->
  <button id="openSettingsBtn" class="cyber-btn settings-toggle-btn" aria-label="Paramètres">
    <i class="fa-solid fa-gear"></i>
  </button>

  <!-- MODAL : Ajout Favori -->
  <div id="addFavModal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h4>NOUVEAU FAVORI</h4>
        <button id="closeAddFavBtn" class="cyber-btn close-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="favForm" class="modal-form">
        <div class="form-group">
          <label for="favNameInput">Nom du site</label>
          <input type="text" id="favNameInput" class="cyber-input" required>
        </div>
        <div class="form-group">
          <label for="favUrlInput">URL du site</label>
          <input type="url" id="favUrlInput" class="cyber-input" placeholder="https://" required>
        </div>
        <div class="form-group">
          <label for="favCategoryInput">Catégorie</label>
          <select id="favCategoryInput" class="cyber-select">
            <option value="dev">Dev</option>
            <option value="media">Médias</option>
            <option value="loisirs">Loisirs</option>
          </select>
        </div>
        <button type="submit" class="cyber-btn submit-btn">Enregistrer</button>
      </form>
    </div>
  </div>

  <!-- MODAL : Paramètres -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h4>PARAMÈTRES SYSTÈME</h4>
        <button id="closeSettingsBtn" class="cyber-btn close-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label>Couleur Néon</label>
          <div class="color-picker-grid">
            <button type="button" class="color-dot color-dot-cyan" data-hue="185" aria-label="Cyan"></button>
            <button type="button" class="color-dot color-dot-pink" data-hue="340" aria-label="Rose"></button>
            <button type="button" class="color-dot color-dot-purple" data-hue="270" aria-label="Violet"></button>
            <button type="button" class="color-dot color-dot-green" data-hue="140" aria-label="Vert"></button>
            <button type="button" class="color-dot color-dot-orange" data-hue="45" aria-label="Orange"></button>
          </div>
        </div>

        <div class="form-group">
          <label for="bgTypeSelect">Style de Fond</label>
          <select id="bgTypeSelect" class="cyber-select">
            <option value="particles">Particules Interactives</option>
            <option value="color">Couleur Unie</option>
            <option value="image">Image Personnalisée</option>
          </select>
        </div>

        <div class="form-group">
          <label>Arrondi des Cartes</label>
          <div class="radius-selector-grid">
            <button type="button" class="cyber-btn radius-btn" data-radius="0px">Brut</button>
            <button type="button" class="cyber-btn radius-btn" data-radius="4px">Cyber</button>
            <button type="button" class="cyber-btn radius-btn" data-radius="14px">Lisse</button>
          </div>
        </div>

        <div class="form-actions">
          <button id="resetSettingsBtn" class="cyber-btn danger-btn">Réinitialiser</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
